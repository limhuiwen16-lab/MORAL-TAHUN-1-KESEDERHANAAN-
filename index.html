<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>道德教育：中庸 · 一年级小测验 🌟</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; font-family: "Microsoft YaHei", sans-serif; }
  body {
    min-height: 100vh;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    display: flex; align-items: center; justify-content: center;
    padding: 20px;
  }
  .card {
    background: #fff; border-radius: 24px;
    box-shadow: 0 20px 60px rgba(0,0,0,.3);
    max-width: 600px; width: 100%; padding: 40px 30px;
    text-align: center;
    animation: pop .4s ease;
  }
  @keyframes pop { from { transform: scale(.9); opacity: 0; } to { transform: scale(1); opacity: 1; } }

  h1 { color: #5b3fa0; margin-bottom: 10px; font-size: 26px; }
  .subtitle { color: #888; margin-bottom: 24px; line-height: 1.6; }

  .progress-bar {
    background: #eee; border-radius: 20px; height: 14px;
    overflow: hidden; margin-bottom: 24px;
  }
  .progress-fill {
    height: 100%; width: 0%;
    background: linear-gradient(90deg, #667eea, #764ba2);
    border-radius: 20px; transition: width .4s ease;
  }

  .qnum { color: #764ba2; font-weight: bold; margin-bottom: 8px; }
  .question { font-size: 19px; color: #333; margin-bottom: 24px; line-height: 1.7; min-height: 60px; }

  .btn {
    display: block; width: 100%; padding: 14px; margin: 10px 0;
    font-size: 17px; border: none; border-radius: 14px;
    cursor: pointer; transition: all .2s; color: #fff; line-height: 1.5;
  }
  .btn-true  { background: linear-gradient(135deg, #43cea2, #185a9d); }
  .btn-false { background: linear-gradient(135deg, #ff6a6a, #d63031); }
  .btn-choice { background: linear-gradient(135deg, #667eea, #764ba2); text-align: left; }
  .btn:hover:not(:disabled) { transform: translateY(-3px); box-shadow: 0 8px 20px rgba(0,0,0,.25); }
  .btn:disabled { cursor: default; opacity: .85; }

  .btn-start {
    background: linear-gradient(135deg, #f7971e, #ffd200);
    color: #5b3fa0; font-size: 22px; padding: 18px;
  }

  .feedback {
    font-size: 16px; font-weight: bold; margin-top: 14px;
    min-height: 60px; line-height: 1.6;
  }
  .correct { color: #27ae60; animation: bounce .5s; }
  .wrong   { color: #e74c3c; animation: shake .4s; }
  @keyframes bounce { 0%,100%{transform:scale(1)} 50%{transform:scale(1.1)} }
  @keyframes shake { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-8px)} 75%{transform:translateX(8px)} }

  .score-big { font-size: 56px; color: #5b3fa0; font-weight: bold; margin: 10px 0; }
  .emoji-big { font-size: 80px; }

  .hidden { display: none; }
</style>
</head>
<body>

<div class="card" id="startScreen">
  <div class="emoji-big">🌟</div>
  <h1>道德教育：中庸（适度）小测验</h1>
  <p class="subtitle">专为一年级小朋友设计 🧒<br>
  共 14 道题目（判断题 + 选择题），每题 1 分<br>
  一起来学习"不浪费、不过分、适可而止"的中庸美德吧！</p>
  <button class="btn btn-start" onclick="startGame()">开始挑战 🚀</button>
</div>

<div class="card hidden" id="quizScreen">
  <div class="progress-bar"><div class="progress-fill" id="progress"></div></div>
  <div class="qnum" id="qnum"></div>
  <div class="question" id="question"></div>
  <div id="options"></div>
  <div class="feedback" id="feedback"></div>
</div>

<div class="card hidden" id="endScreen">
  <div class="emoji-big" id="endEmoji"></div>
  <h1>挑战结束！</h1>
  <div class="score-big" id="finalScore"></div>
  <p class="subtitle" id="rankText"></p>
  <button class="btn btn-start" onclick="location.reload()">再来一次 🔄</button>
</div>

<script>
// type: "judge" 判断题 | "choice" 选择题
const questions = [
  // ===== 原判断题 =====
  { type: "judge", q: "每次到婆婆家吃饭，我都会大吃大喝。", a: false,
    e: "暴饮暴食对身体不好，吃饭要适量哦！" },
  { type: "judge", q: "就算天气阴凉，我还是把空调调到最低温。", a: false,
    e: "适度使用空调，节约能源又环保 🌱" },
  { type: "judge", q: "我会好好安排玩乐与温习功课的时间，避免浪费时间。", a: true,
    e: "劳逸结合、安排好时间，棒极了！👍" },
  { type: "judge", q: "我只买需要的文具，这样可以节省金钱。", a: true,
    e: "理性消费、勤俭节约是好习惯 💰" },
  { type: "judge", q: "朋友踩到我的脚，我揍他一顿。", a: false,
    e: "暴力不能解决问题，要学会宽容原谅 🕊️" },
  { type: "judge", q: "称呼别人时，我会用礼貌的方式，表示尊重。", a: true,
    e: "礼貌待人，尊重他人，很有教养！😊" },
  { type: "judge", q: "我考试拿到满分，我要求父母买最贵的手机给我。", a: false,
    e: "努力学习是本分，不应提过分要求哦～" },
  { type: "judge", q: "我喜欢游泳，所以常常游到超过5个小时。", a: false,
    e: "凡事要有度，过度运动伤身体 🏊" },
  { type: "judge", q: "中庸让我们身心获得平衡，生活更加健康。", a: true,
    e: "没错！中庸之道，平衡之美 ✨" },

  // ===== 5 道选择题 =====
  { type: "choice",
    q: "小明在学校食堂吃午餐，面对香喷喷的饭菜，他应该怎么做才对呢？",
    options: [
      "吃多少就盛多少，开开心心地把盘子里的饭菜吃完。",
      "盛满满一大碗，吃不完就直接倒进垃圾桶。",
      "把不喜欢的蔬菜偷偷藏在桌子底下不吃。"
    ],
    a: 0,
    e: "这样做既能吃饱，又不会浪费食物，刚刚好！" },
  { type: "choice",
    q: "妈妈给了小华5令吉零花钱。她看到很多好看的小玩具，但家里已经有不少了。她应该怎么做？",
    options: [
      "把钱全部买零食吃光。",
      "把一部分钱存进扑满，只买自己现在真正需要的东西。",
      "哭着让妈妈把所有的玩具都买下来。"
    ],
    a: 1,
    e: "适度花钱、懂得储蓄和克制欲望是个好习惯！" },
  { type: "choice",
    q: "放学回到家后，小勇很想玩好玩的积木。他应该如何安排放学后的时间呢？",
    options: [
      "先认真完成作业，然后再玩一会儿积木。",
      "一直玩积木玩到很晚，作业明天早上到学校再补。",
      "整天不写作业，一直看电视。"
    ],
    a: 0,
    e: "做到劳逸结合，把学习和玩耍的时间平衡好！" },
  { type: "choice",
    q: "莉莉的同桌不小心碰掉了她的橡皮，同桌赶紧说\"对不起\"。莉莉应该怎么做才算情绪适度？",
    options: [
      "大声尖叫，生气地推开同桌。",
      "生气得连续三天不和任何人说话。",
      "接受同桌的道歉，平静地捡起橡皮。"
    ],
    a: 2,
    e: "心平气和、不发脾气，就是情绪上的\"中庸\"！" },
  { type: "choice",
    q: "妈妈带小明去文具店。小明家里已经有5支好用的铅笔了，他又看到了一支漂亮的铅笔。他应该怎么做？",
    options: [
      "不管家里有没有，看到好看的就一定要买下。",
      "看看自己家里还有很多好用的笔，决定不买了。",
      "要求妈妈把店里所有的铅笔都买回家。"
    ],
    a: 1,
    e: "适度满足，不贪心、不重复购买不需要的东西！" },
];

let current = 0, score = 0;
const total = questions.length;

const startScreen = document.getElementById("startScreen");
const quizScreen  = document.getElementById("quizScreen");
const endScreen   = document.getElementById("endScreen");
const qnumEl      = document.getElementById("qnum");
const questionEl  = document.getElementById("question");
const optionsEl   = document.getElementById("options");
const feedbackEl  = document.getElementById("feedback");
const progressEl  = document.getElementById("progress");

function startGame() {
  current = 0; score = 0;
  startScreen.classList.add("hidden");
  quizScreen.classList.remove("hidden");
  showQuestion();
}

function showQuestion() {
  feedbackEl.textContent = "";
  feedbackEl.className = "feedback";
  qnumEl.textContent = `第 ${current + 1} / ${total} 题`;
  questionEl.textContent = questions[current].q;
  progressEl.style.width = (current / total * 100) + "%";

  optionsEl.innerHTML = "";
  const q = questions[current];

  if (q.type === "judge") {
    const bt = document.createElement("button");
    bt.className = "btn btn-true";
    bt.textContent = "✔ 对";
    bt.onclick = () => answer(0);
    const bf = document.createElement("button");
    bf.className = "btn btn-false";
    bf.textContent = "✘ 错";
    bf.onclick = () => answer(1);
    optionsEl.appendChild(bt);
    optionsEl.appendChild(bf);
  } else {
    q.options.forEach((opt, i) => {
      const b = document.createElement("button");
      b.className = "btn btn-choice";
      b.textContent = ["① ", "② ", "③ "][i] + opt;
      b.onclick = () => answer(i);
      optionsEl.appendChild(b);
    });
  }
}

function answer(choice) {
  const q = questions[current];
  const isRight = (choice === q.a);
  [...optionsEl.children].forEach(b => b.disabled = true);

  if (isRight) {
    score++;
    feedbackEl.textContent = "🎉 太棒了！答对啦 +1 分　" + q.e;
    feedbackEl.classList.add("correct");
  } else {
    feedbackEl.textContent = "😅 答错了～正确答案是 " +
      (q.type === "judge"
        ? (q.a === 0 ? "「对」" : "「错」")
        : ["①", "②", "③"][q.a] + "　")
      + q.e;
    feedbackEl.classList.add("wrong");
  }

  setTimeout(() => {
    current++;
    if (current < total) showQuestion();
    else showResult();
  }, 2200);
}

function showResult() {
  quizScreen.classList.add("hidden");
  endScreen.classList.remove("hidden");
  document.getElementById("finalScore").textContent = score + " / " + total + " 分";

  let emoji, rank;
  const rate = score / total;
  if (rate === 1)      { emoji = "🏆"; rank = "满分达人！你简直是中庸小智者！"; }
  else if (rate >= .8) { emoji = "🌟"; rank = "非常优秀！继续保持好习惯～"; }
  else if (rate >= .6) { emoji = "😊"; rank = "不错哦！还有一些进步空间！"; }
  else                 { emoji = "📚"; rank = "别灰心，再学一学中庸之道吧！"; }

  document.getElementById("endEmoji").textContent = emoji;
  document.getElementById("rankText").textContent = rank;
}
</script>

</body>
</html>
